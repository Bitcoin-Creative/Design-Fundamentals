<svg width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#F7931A" opacity="0.1"/>
  <circle cx="1180" cy="540" r="250" fill="#F7931A" opacity="0.08"/>
  
  <!-- Bitcoin symbol -->
  <text x="640" y="200" font-family="Arial, sans-serif" font-size="80" fill="#F7931A" text-anchor="middle"></text>
  
  <!-- Main title -->
  <text x="640" y="300" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Design Fundamentals</text>
  
  <!-- Subtitle -->
  <text x="640" y="370" font-family="Arial, sans-serif" font-size="28" fill="#888888" text-anchor="middle">Programa de Formação em Design do Bitcoin Creative</text>
  
  <!-- Stats -->
  <text x="440" y="480" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#F7931A" text-anchor="middle">14</text>
  <text x="440" y="520" font-family="Arial, sans-serif" font-size="18" fill="#888888" text-anchor="middle">PROJETOS</text>
  
  <text x="640" y="480" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#F7931A" text-anchor="middle">14</text>
  <text x="640" y="520" font-family="Arial, sans-serif" font-size="18" fill="#888888" text-anchor="middle">DESIGNERS</text>
  
  <text x="840" y="480" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#F7931A" text-anchor="middle">100%</text>
  <text x="840" y="520" font-family="Arial, sans-serif" font-size="18" fill="#888888" text-anchor="middle">OPEN SOURCE</text>
  
  <!-- Footer -->
  <text x="640" y="600" font-family="Arial, sans-serif" font-size="20" fill="#F7931A" text-anchor="middle">bitcoincreative.org</text>
</svg>
